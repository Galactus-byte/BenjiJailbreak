
name: BenjiJailbreak
options:
  bundleIdPrefix: com.benji
  deploymentTarget:
    iOS: 14.0
targets:
  BenjiJailbreak:
    type: application
    platform: iOS
    sources: [sources]   # <-- points to your "sources" folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benji.jailbreak
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - framework: UIKit
      - framework: SwiftUI
      - framework: Foundation
      - framework: IOKit
      - framework: Accessibility
    entitlements:
      - com.apple.private.security.container-required: true
      - task_for_pid-allow: true
      - com.apple.private.cs.debugger: true
      - dynamic-codesigning: true
      - proc-info-allow: true
      - rootless-allow: true