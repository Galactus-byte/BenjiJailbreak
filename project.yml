name: Build IPA (Xcodegen)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: List repo files (debug)
        run: ls -la

      - name: Check project.yml exists
        run: test -f project.yml || (echo "ERROR: project.yml missing" && exit 1)

      - name: Download and install xcodegen
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.40.0/xcodegen.zip -o xcodegen.zip
          unzip xcodegen.zip -d xcodegen
          chmod +x xcodegen/bin/xcodegen
          echo "$(pwd)/xcodegen/bin" >> $GITHUB_PATH

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build .app (unsigned)
        run: |
          xcodebuild -project BenjiJailbreak.xcodeproj \
                     -scheme BenjiJailbreak \
                     -configuration Release \
                     -derivedDataPath build \
                     -destination generic/platform=iOS \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/BenjiJailbreak.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r BenjiJailbreak.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BenjiJailbreak.ipa
          path: BenjiJailbreak.ipa