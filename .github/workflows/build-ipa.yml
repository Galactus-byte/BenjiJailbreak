name: Build IPA with SPM (IOKit fixed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Create Package.swift
        run: |
          cat > Package.swift <<'EOF'
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(
              name: "BenjiJailbreak",
              platforms: [.iOS(.v14)],
              products: [
                  .executable(name: "BenjiJailbreak", targets: ["BenjiJailbreak"])
              ],
              targets: [
                  .executableTarget(
                      name: "BenjiJailbreak",
                      path: "sources",
                      linkerSettings: [
                          .linkedFramework("UIKit"),
                          .linkedFramework("Foundation"),
                          .linkedFramework("IOKit")
                      ]
                  )
              ]
          )
          EOF

      - name: Build with SPM for iOS
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          swift build -c release \
            --triple arm64-apple-ios14.0 \
            -Xswiftc -sdk -Xswiftc "$SDK" \
            -Xswiftc -F -Xswiftc "$SDK/System/Library/Frameworks" \
            -Xswiftc -F -Xswiftc "$SDK/System/Library/PrivateFrameworks"

      - name: Package .app and sign
        run: |
          mkdir -p Payload/BenjiJailbreak.app
          cp .build/arm64-apple-ios14.0/release/BenjiJailbreak Payload/BenjiJailbreak.app/
          cat > Payload/BenjiJailbreak.app/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>BenjiJailbreak</string>
            <key>CFBundleIdentifier</key><string>com.benji.jailbreak</string>
            <key>CFBundleName</key><string>BenjiJailbreak</string>
            <key>CFBundleVersion</key><string>1.0</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>MinimumOSVersion</key><string>14.0</string>
          </dict>
          </plist>
          EOF
          cat > Payload/BenjiJailbreak.app/entitlements.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.private.security.container-required</key><true/>
            <key>task_for_pid-allow</key><true/>
            <key>com.apple.private.cs.debugger</key><true/>
            <key>dynamic-codesigning</key><true/>
            <key>proc-info-allow</key><true/>
            <key>rootless-allow</key><true/>
          </dict>
          </plist>
          EOF
          codesign --force --sign - --entitlements Payload/BenjiJailbreak.app/entitlements.plist Payload/BenjiJailbreak.app/BenjiJailbreak
          zip -r BenjiJailbreak.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BenjiJailbreak.ipa
          path: BenjiJailbreak.ipa