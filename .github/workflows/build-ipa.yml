name: Build Benji IPA (Unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Download xcodegen binary directly (no brew)
      - name: Install xcodegen
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.40.0/xcodegen.zip -o xcodegen.zip
          unzip xcodegen.zip -d xcodegen
          echo "$(pwd)/xcodegen" >> $GITHUB_PATH

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build .app (unsigned)
        run: |
          xcodebuild -project BenjiJailbreak.xcodeproj \
                     -scheme BenjiJailbreak \
                     -configuration Release \
                     -derivedDataPath build \
                     -destination generic/platform=iOS \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package .ipa (unsigned)
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/BenjiJailbreak.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r BenjiJailbreak.ipa Payload/

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BenjiJailbreak-unsigned.ipa
          path: BenjiJailbreak.ipa