name: Build IPA (XcodeGen + xcodebuild)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build with xcodebuild (unsigned)
        run: |
          xcodebuild -project BenjiJailbreak.xcodeproj \
                     -scheme BenjiJailbreak \
                     -configuration Release \
                     -derivedDataPath build \
                     -destination generic/platform=iOS \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/BenjiJailbreak.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r BenjiJailbreak.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BenjiJailbreak.ipa
          path: BenjiJailbreak.ipa