name: Build and Sign IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      TEAM_ID: ${{ secrets.TEAM_ID }}
      BUNDLE_ID: com.yourname.benjijailbreak
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Download exploit binary (palera1n)
        run: |
          mkdir -p BenjiJailbreak/Resources
          curl -L -o BenjiJailbreak/Resources/exploit https://github.com/palera1n/palera1n/releases/latest/download/palera1n
          chmod +x BenjiJailbreak/Resources/exploit

      - name: Download .deb packages
        run: |
          curl -L -o BenjiJailbreak/Resources/sileo.deb https://repo.getsileo.app/debs/sileo.deb
          curl -L -o BenjiJailbreak/Resources/cydia.deb https://cydia.saurik.com/debs/cydia_1.1.36_iphoneos-arm.deb
          # For darksword, use a placeholder – replace with real URL if you have one
          echo "Placeholder for darksword" > BenjiJailbreak/Resources/darksword.deb

      - name: Generate Xcode project with xcodegen
        run: xcodegen generate

      - name: Build and archive
        run: |
          xcodebuild -project BenjiJailbreak.xcodeproj -scheme BenjiJailbreak -configuration Release -archivePath build/BenjiJailbreak.xcarchive archive DEVELOPMENT_TEAM=${{ secrets.TEAM_ID }} CODE_SIGN_IDENTITY="Apple Development"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive -archivePath build/BenjiJailbreak.xcarchive -exportPath build -exportOptionsPlist <(echo '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>method</key><string>development</string><key>teamID</key><string>${{ secrets.TEAM_ID }}</string></dict></plist>')

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v3
        with:
          name: BenjiJailbreak
          path: build/BenjiJailbreak.ipa